<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light">
<meta name="description" content="Wall labels, price lists, certificates of authenticity and an edition register for artists. Free, in your browser, no account.">
<title>Exhibition &amp; Edition Kit</title>
<style>
.register-group{border-top:1px solid var(--line);padding:10px 0}
.register-group summary{cursor:pointer;font-weight:600}
.register-group .tw{margin:8px 0}
.register-batch{margin:12px 0}

:root{--bg:#f6f4ef;--card:#fff;--ink:#1d1b18;--mute:#6b665e;--line:#ddd8cd;--acc:#2f4a3f;--acc2:#e8efe9;--warn:#8a4b00;--warnbg:#fff3df;--bad:#9b1c1c}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
.wrap{max-width:1040px;margin:0 auto;padding:16px}
header.top{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-start;justify-content:space-between;margin-bottom:8px}
h1{font:600 26px/1.2 Georgia,"Times New Roman",serif;margin:0 0 4px}
.tag{margin:0;color:var(--mute);max-width:640px;font-size:14px}
.lang{display:flex;gap:4px}
button,.btn,select,input,textarea{font:inherit;color:inherit}
button,.btn{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 12px;cursor:pointer;min-height:40px}
button:hover{border-color:var(--acc)}
button.primary{background:var(--acc);color:#fff;border-color:var(--acc)}
button.danger{color:var(--bad);border-color:#e3b9b9}
button.danger.armed{background:var(--bad);color:#fff;border-color:var(--bad)}
button[aria-pressed="true"]{background:var(--acc);color:#fff;border-color:var(--acc)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #7aa392;outline-offset:1px}
nav.tabs{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0 16px}
nav.tabs button{border-radius:999px;padding:6px 14px;min-height:38px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:16px}
.panel h2{font:600 18px/1.3 Georgia,serif;margin:0 0 10px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--mute)}
label.f input,label.f select,label.f textarea{border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:#fff;color:var(--ink);font-size:16px;min-width:0;width:100%}
textarea{min-height:76px;resize:vertical}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.row.gap{margin-top:12px}
.chk{display:inline-flex;gap:6px;align-items:center;font-size:14px;color:var(--ink)}
.chk input{width:18px;height:18px}
.note{font-size:13px;color:var(--mute)}
.warn{background:var(--warnbg);color:var(--warn);border:1px solid #efd3a4;border-radius:8px;padding:8px 10px;font-size:13px;margin:8px 0}
.empty{color:var(--mute);padding:24px;text-align:center;border:1px dashed var(--line);border-radius:12px}
.work{border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:12px;background:#fcfbf8}
.work h3{margin:0 0 8px;font-size:15px;color:var(--mute);font-weight:600}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%}
th,td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top;font-size:14px}
th{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--mute)}
td input,td select{border:1px solid var(--line);border-radius:6px;padding:5px 6px;width:100%;min-width:90px;background:#fff;font-size:14px}
.pills{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.pill{background:var(--acc2);border-radius:999px;padding:3px 10px;font-size:13px}
.toast{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;max-width:90vw;z-index:9}
.toast.err{background:var(--bad)}
footer{color:var(--mute);font-size:12px;text-align:center;padding:16px 0 32px}
/* printable sheets (also shown on screen as preview) */
.sheet{background:#fff;color:#000;border:1px solid var(--line);border-radius:6px;padding:18mm 16mm;font-family:Georgia,"Times New Roman",serif}
.sheet h2{font:600 22px/1.2 Georgia,serif;margin:0 0 2px}
.sheet .sub{color:#444;font-size:13px;margin:0 0 14px}
.sheet table th,.sheet table td{font-size:13px;border-bottom:1px solid #ccc;color:#000}
.labels{display:grid;gap:10mm}
.labels.c1{grid-template-columns:1fr}.labels.c2{grid-template-columns:1fr 1fr}.labels.c3{grid-template-columns:1fr 1fr 1fr}
.label{border:1px solid #bbb;padding:7mm;break-inside:avoid;page-break-inside:avoid;min-height:38mm}
.label .a{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:#333}
.label .t{font-size:18px;font-style:italic;margin:2px 0 4px}
.label .d{font-size:13px;line-height:1.45}
.label .p{margin-top:6px;font-size:14px;font-weight:700}
.cert{break-after:page;page-break-after:always;border:2px solid #000;padding:14mm;min-height:230mm;display:flex;flex-direction:column}
.cert:last-child{break-after:auto;page-break-after:auto}
.cert h2{text-align:center;font-size:28px;letter-spacing:.04em;margin:6mm 0 10mm}
.cert .body{font-size:16px;line-height:1.7}
.cert dl{display:grid;grid-template-columns:34mm 1fr;gap:2mm 6mm;margin:8mm 0;font-size:15px}
.cert dt{color:#444}.cert dd{margin:0;font-weight:600}
.cert .disc{font-size:11px;color:#444;margin-top:auto}
.sig{display:flex;gap:16mm;margin-top:16mm}
.sig div{flex:1;border-top:1px solid #000;padding-top:2mm;font-size:12px;color:#333}
.kv{display:grid;grid-template-columns:44mm 1fr;gap:2mm 6mm;font-size:14px;margin:6mm 0}
.kv dt{color:#444}.kv dd{margin:0;white-space:pre-wrap}
.sheet.plain .block{border:1px solid #bbb;padding:4mm;min-height:24mm;white-space:pre-wrap;font-size:14px}
@media (max-width:640px){.wrap{padding:12px}h1{font-size:22px}.sheet{padding:12px}.cert{padding:12px;min-height:0}}
@page{margin:10mm}
@media print{
  body{background:#fff}
  .wrap{max-width:none;padding:0}
  .noprint,header.top,nav.tabs,footer,.toast{display:none!important}
  .sheet{border:0;border-radius:0;padding:0}
  .cert{min-height:234mm;max-height:240mm;overflow:hidden}
}

/* v1.1 design pass */

.wrap{max-width:1080px;padding:28px 20px 16px}
.brand{margin:0 0 6px;font-size:11px;letter-spacing:.32em;color:var(--gold);font-weight:600}
h1{font:500 34px/1.1 Georgia,"Times New Roman",serif;letter-spacing:-.01em;margin:0 0 8px}
.tag{font-size:15px;max-width:620px;color:#5d584f}
.lang{display:none}
header.top{padding-bottom:18px;border-bottom:1px solid var(--line);margin-bottom:6px}
nav.tabs{gap:4px;margin:16px 0 20px;border-bottom:1px solid var(--line);padding-bottom:0}
nav.tabs button{border:0;border-radius:8px 8px 0 0;background:transparent;padding:10px 14px;min-height:42px;color:#5d584f;font-weight:500;border-bottom:3px solid transparent}
nav.tabs button:hover{color:var(--ink)}
nav.tabs button[aria-pressed="true"]{background:transparent;color:var(--acc);border-bottom-color:var(--acc)}
.panel{border-radius:14px;padding:22px;box-shadow:0 1px 2px rgba(30,25,15,.04),0 8px 24px rgba(30,25,15,.04);border-color:#e6e1d6}
.panel h2{font:500 20px/1.3 Georgia,serif}
button{border-radius:10px;transition:border-color .15s,background .15s}
button.primary{background:var(--acc);box-shadow:0 1px 0 rgba(0,0,0,.15)}
button.primary:hover{background:#1c342c}
.empty{border:1px dashed #cfc8b8;background:#faf8f3;padding:36px 24px}
.empty-h{font:500 20px Georgia,serif;margin:0 0 6px;color:var(--ink)}
.work{background:#fff;border-radius:12px}
th{letter-spacing:.08em}
footer{letter-spacing:.04em}
/* labels: gallery wall-label look */
.sheet{border-radius:10px}
.label{border:0;border-left:3px solid var(--gold);background:#fff;padding:7mm 7mm 7mm 8mm;box-shadow:0 0 0 1px #e8e4da}
.label .a{font:600 10px/1.3 "Inter",Arial,sans-serif;letter-spacing:.2em;color:#6b665e}
.label .t{font:italic 400 21px/1.2 Georgia,serif;margin:3px 0 6px}
.label .d{font:400 13px/1.5 Georgia,serif;color:#2b2823}
.label .p{font:600 14px "Inter",Arial,sans-serif;margin-top:8px;color:#1d1b18}
/* certificate: framed, centred, formal */
.cert{border:1.5px solid #1d1b18;outline:.6px solid #1d1b18;outline-offset:-4mm;padding:18mm 16mm;align-items:stretch;text-align:center}
.cert .a{font:600 11px "Inter",Arial,sans-serif!important;letter-spacing:.3em!important;color:#6b665e}
.cert h2{font:500 34px/1.15 Georgia,serif;letter-spacing:.02em;margin:10mm 0 4mm}
.cert h2:after{content:"";display:block;width:34mm;height:1px;background:var(--gold);margin:6mm auto 0}
.cert .body{font-size:15px;line-height:1.75;max-width:130mm;margin-left:auto;margin-right:auto}
.cert dl{text-align:left;grid-template-columns:38mm 1fr;margin:10mm auto;width:128mm;font-size:14px;border-top:1px solid #d8d2c4;padding-top:6mm}
.cert dt{font:600 10px "Inter",Arial,sans-serif;letter-spacing:.16em;text-transform:uppercase;color:#6b665e;padding-top:1mm}
.cert dd{font-weight:500}
.sig div{font:600 10px "Inter",Arial,sans-serif;letter-spacing:.08em;text-transform:uppercase;color:#6b665e}
.cert .disc{font:400 10px/1.5 Georgia,serif;color:#6b665e}
@media screen and (max-width:640px){.cert dl{width:auto;grid-template-columns:1fr;gap:1mm}.cert .body{max-width:none}.labels.c2,.labels.c3{grid-template-columns:1fr}.sig{flex-wrap:wrap;gap:8mm}.kv{grid-template-columns:1fr}.sheet{overflow-x:auto}.cert{outline-offset:-2mm;padding:14px}}

function h(tag,props){
  var el=document.createElement(tag);
  if(props){Object.keys(props).forEach(function(k){
    var v=props[k];if(v===null||v===undefined||v===false)return;
    if(k==='class')el.className=v;
    else if(k==='text')el.textContent=v;
    else if(k.slice(0,2)==='on')el.addEventListener(k.slice(2),v);
    else if(k==='value'||k==='checked'||k==='selected'||k==='disabled'||k==='multiple')el[k]=v;
    else el.setAttribute(k,v===true?'':String(v));
  })}
  for(var i=2;i<arguments.length;i++)add(el,arguments[i]);
  return el;
}
function add(el,k){
  if(k===null||k===undefined||k===false)return;
  if(Array.isArray(k)){k.forEach(function(x){add(el,x)});return}
  el.appendChild(typeof k==='object'?k:document.createTextNode(String(k)));
}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8)}

function num(v,min,max){var n=Number(v);if(!isFinite(n))return null;return Math.min(max,Math.max(min,n))}
function intIn(v,min,max){var n=num(v,min,max);return n===null?min:Math.floor(n)}
function pad2(n){return n<10?'0'+n:''+n}
function todayISO(){var d=new Date();return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate())}
function validISO(s){
  if(!/^\d{4}-\d{2}-\d{2}$/.test(s||''))return false;
  var date=new Date(s+'T00:00:00Z');
  return Number.isFinite(date.getTime())&&date.toISOString().slice(0,10)===s;
}
function fmtDate(iso){
  if(!validISO(iso))return '';
  var p=iso.split('-').map(Number);

function hasCopyRecord(c){return c.status!=='available'||c.buyer!==''||c.date!==''||c.sale!==null}
function addOpenCopy(w){
  var n=w.copies.reduce(function(last,c){return c.kind==='open'?Math.max(last,c.n):last},0)+1;
  w.copies.push({id:uid(),kind:'open',n:n,of:1,status:'available',buyer:'',date:'',sale:null});
}
function buildCopies(w){
  var want=[];
  if(w.open){
    w.copies=w.copies.filter(function(c){return c.kind==='open'||hasCopyRecord(c)});
    return 0;
  }
  if(w.edSize<=0)want.push({kind:'unique',n:1,of:1});
  else{for(var i=1;i<=w.edSize;i++)want.push({kind:'ed',n:i,of:w.edSize});for(var j=1;j<=w.apCount;j++)want.push({kind:'ap',n:j,of:w.apCount})}
  var old={};w.copies.forEach(function(c){old[c.kind+':'+c.n]=c});
  var out=[],used={};
  want.forEach(function(x){var k=x.kind+':'+x.n,c=old[k];used[k]=1;
    if(c){c.of=x.of;out.push(c)}else out.push({id:uid(),kind:x.kind,n:x.n,of:x.of,status:'available',buyer:'',date:'',sale:null})});
  var extra=0;
  w.copies.forEach(function(c){if(!used[c.kind+':'+c.n]&&(c.kind==='open'||hasCopyRecord(c))){out.push(c);extra++}});
  var ord={ed:0,ap:1,unique:2,open:3};
  out.sort(function(a,b){return ord[a.kind]-ord[b.kind]||a.n-b.n});
  w.copies=out;return extra;
}

  w.open=x.open===true;
  w.edSize=intIn(x.edSize,0,999);w.apCount=w.edSize>0?intIn(x.apCount,0,99):0;
  var p=x.price===null||x.price===''||x.price===undefined?null:num(x.price,0,1e9);w.price=p;w.notes=clip(x.notes,1000);
  var c=x.cond||{};w.cond={date:validISO(c.date)?c.date:'',by:clip(c.by,120),overall:CONDS.indexOf(c.overall)>=0?c.overall:'good',loc:clip(c.loc,160),details:clip(c.details,2000)};
  var k=x.cons||{};w.cons={consignee:clip(k.consignee,160),contact:clip(k.contact,200),start:validISO(k.start)?k.start:'',end:validISO(k.end)?k.end:'',comm:k.comm===''||k.comm===null||k.comm===undefined?'':String(num(k.comm,0,100)===null?'':num(k.comm,0,100)),ins:INS.indexOf(k.ins)>=0?k.ins:'gallery',notes:clip(k.notes,2000)};
  var seen={};
  (Array.isArray(x.copies)?x.copies:[]).forEach(function(r){
    if(!r||['ed','ap','unique','open'].indexOf(r.kind)<0)return;
    var n=intIn(r.n,1,r.kind==='open'?Number.MAX_SAFE_INTEGER:999),key=r.kind+':'+n;if(seen[key])return;seen[key]=1;
    w.copies.push({id:clip(r.id,40)||uid(),kind:r.kind,n:n,of:intIn(r.of,1,999),status:STATUSES.indexOf(r.status)>=0?r.status:'available',buyer:clip(r.buyer,160),date:validISO(r.date)?r.date:'',sale:r.sale===null||r.sale===''||r.sale===undefined?null:num(r.sale,0,1e9)});
  });
  buildCopies(w);return w;
}

  state.works.forEach(function(w){w.copies.forEach(function(c){

  })});

function parseCsv(text){
  text=String(text).replace(/^\ufeff/,'');
  var first=text.split(/\r?\n/)[0]||'',sep=(first.split(';').length>first.split(',').length)?';':(first.indexOf('\t')>=0&&first.indexOf(',')<0?'\t':',');
  var rows=[],row=[],cell='',q=false,i,ch;
  for(i=0;i<text.length;i++){ch=text[i];
    if(q){if(ch==='"'){if(text[i+1]==='"'){cell+='"';i++}else q=false}else cell+=ch}
    else if(ch==='"')q=true;
    else if(ch===sep){row.push(cell);cell=''}
    else if(ch==='\n'||ch==='\r'){if(ch==='\r'&&text[i+1]==='\n')i++;row.push(cell);rows.push(row);row=[];cell=''}
    else cell+=ch;
    if(rows.length>2000)break}
  if(cell!==''||row.length){row.push(cell);rows.push(row)}
  return rows.filter(function(r){return r.some(function(c){return String(c).trim()!==''})});
}
function csvWorks(text){
  var rows=parseCsv(text);if(rows.length<2)return [];
  var hd=rows[0].map(function(x){return String(x).trim().toLowerCase().replace(/[^a-z0-9]+/g,' ').trim()});
  function col(names){for(var i=0;i<names.length;i++){var k=hd.indexOf(names[i]);if(k>=0)return k}return -1}
  var C={title:col(['title','name','work','artwork','artwork title','product title']),year:col(['year','date','year made']),medium:col(['medium','technique','materials','material','type','product type']),dims:col(['dimensions','dims','size','sizes','image size','paper size']),ed:col(['edition','edition size','editions','ed','run']),ap:col(['proofs','ap','aps','artist proofs','artists proofs','artist s proofs']),price:col(['price','list price','retail price','variant price','amount'])};
  if(C.title<0)return [];
  var out=[],seen=new Set();
  rows.slice(1).forEach(function(r){
    var g=function(k){return C[k]>=0?String(r[C[k]]||'').trim():''};
    var title=g('title');if(!title)return;
    var w=newWork();w.title=clip(title,200);w.year=clip(g('year'),20);w.medium=clip(g('medium'),200);w.dims=clip(g('dims'),120);
    w.open=/^(open|open edition)$/i.test(g('ed'));
    var ed=g('ed').match(/(\d+)\s*$/);w.edSize=ed?intIn(ed[1],0,999):0;
    var ap=g('ap').match(/\d+/);w.apCount=w.edSize>0&&ap?intIn(ap[0],0,99):0;
    var p=g('price').replace(/[^0-9.,]/g,'');if(/,\d{2}$/.test(p)&&p.indexOf('.')<0)p=p.replace(',','.');p=p.replace(/,/g,'');
    w.price=p===''?null:num(p,0,1e9);
    var key=catalogueKey(w);
    if(seen.has(key))return;
    seen.add(key);out.push(w);
  });
  return out;
}
function catalogueKey(w){
  return JSON.stringify([
    w.title.trim().toLowerCase(),w.year.trim(),w.medium.trim().toLowerCase(),w.dims.trim().toLowerCase(),
    w.open,w.open?0:w.edSize,w.open?0:w.apCount
  ]);
}
function newCatalogueWorks(works,existing){
  var keys=new Set(existing.map(catalogueKey));
  return works.filter(function(w){return !keys.has(catalogueKey(w))});
}

}
function vBackup(){
  var box=h('div');
  var pend=h('div',{class:'row gap'});
  var file=h('input',{type:'file',accept:'application/json,.json','aria-label':t('bkRestore'),onchange:function(e){
    var f=e.target.files&&e.target.files[0];pend.textContent='';if(!f)return;
    if(f.size>5*1024*1024){toast(t('bkBig'),true);return}
    var r=new FileReader();
    r.onload=function(){
      var data=null;try{data=JSON.parse(String(r.result))}catch(x){data=null}
      if(!data||data.app!=='aek-exhibition-kit'||!Array.isArray(data.works)){toast(t('bkBad'),true);return}
      var next=cleanState(data);
      var b=h('button',{type:'button',class:'primary',text:t('bkConfirm',{n:next.works.length}),onclick:function(){state=next;save();tab='works';render();toast(t('bkDone'))}});
      pend.appendChild(b);
    };
    r.onerror=function(){toast(t('bkBad'),true)};
    r.readAsText(f);
  }});
  var clr=h('button',{type:'button',class:'danger',text:t('clearAll')});
  armed(clr,'clearAll','clearSure',function(){state=blank();try{localStorage.removeItem(KEY)}catch(e){}save();render();toast(t('cleared'))});
  box.appendChild(h('section',{class:'panel'},h('h2',{text:t('bkH')}),
    h('div',{class:'row'},
      h('button',{type:'button',class:'primary',text:t('bkSave'),onclick:function(){download('exhibition-kit-backup-'+todayISO()+'.json',JSON.stringify(state,null,1),'application/json');toast(t('bkSaved'))}}),
      h('button',{type:'button',text:t('bkCsv'),onclick:exportCsv}),
      clr),
    h('div',{class:'row gap'},field(t('bkRestore'),file)),pend));
  box.appendChild(importBox());
  box.appendChild(h('section',{class:'panel'},h('h2',{text:t('aboutH')}),h('p',{text:t('about1')}),h('p',{text:t('about2')}),h('p',{text:t('about3')})));
  return box;
}

load();
render();
})();
</script>
